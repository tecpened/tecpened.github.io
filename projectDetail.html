<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        header, footer {
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 90%;
            background-color: #22222221;
            backdrop-filter: blur(20rem);
            /* max-width: 1200px; */
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            align-items: start;
        }
        .image-section {
            background: #222;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px;
            border-radius: 10px;
    
        }
        .image-section img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-card {
            background: #333;
            padding: 15px;
            border-radius: 10px;
        }
        .info-card h4 {
            margin: 0;
            font-size: 14px;
            color: #aaa;
        }
        .info-card p, .info-card a {
            margin: 5px 0 0;
            font-size: 16px;
            color: white;
            text-decoration: none;
        }
        .chips {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .chip {
            background: #444;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- <header>
        <h1>Project Details</h1>
    </header> -->
    <div class="container">
        <div class="grid" id="project-details">
            <!-- Project details will be injected here by JavaScript -->
        </div>
        <div class="chips">
            <span class="chip">Product Design</span>
            <span class="chip">Development</span>
            <span class="chip">Marketing</span>
        </div>
    </div>
    <script src="./js/mapdata.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Get the project ID from the URL (e.g., ?project=project1)
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('project');  // Get project ID from query parameter

            // Check if the project ID exists
            if (projectId && allProjects[projectId]) {
                const project = allProjects[projectId];
                const projectDetails = document.getElementById('project-details');

                // Dynamically inject the project data
                projectDetails.innerHTML = `
                    <div class="image-section">
                        <h3>A MODERN UI</h3>
                        <h1>${project.title}</h1>
                        <p>${project.description}</p>
                        <img src="${project.image}" alt="${project.title}">
                    </div>
                    <div class="info-section">
                        <div class="info-card">
                            <h4>Company</h4>
                            <p>${project.company}</p>
                        </div>
                        <div class="info-card">
                            <h4>Live View</h4>
                            <a href="${project.liveUrl}" target="_blank">Visit Website &#x2192;</a>
                        </div>
                        <div class="info-card">
                            <h4>UI</h4>
                            <p>${project.ui}</p>
                        </div>
                        <div class="info-card">
                            <h4>UX</h4>
                            <p>${project.ux}</p>
                        </div>
                        <div class="info-card">
                            <h4>Technologies</h4>
                            <p>${project.technologies}</p>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('project-details').innerHTML = '<p>Project not found.</p>';
            }
        });
    </script>
</body>
</html>
